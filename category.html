<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="" />
  <title>StoneLight — Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/category.css" />
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar scrolled" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo brand-name">StoneLight</a>
      <nav class="nav-links">
        <a href="index.html#categories">Collections</a>
        <a href="index.html#about">About</a>
        <a href="index.html#contact">Contact</a>
      </nav>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="mobile-menu" id="mobileMenu">
      <a href="index.html#categories" onclick="closeMobile()">Collections</a>
      <a href="index.html#about"      onclick="closeMobile()">About</a>
      <a href="index.html#contact"    onclick="closeMobile()">Contact</a>
    </div>
  </header>

  <!-- CATEGORY HERO -->
  <section class="cat-hero" id="cat-hero">
    <div class="cat-hero-overlay"></div>
    <div class="cat-hero-content">
      <!-- Breadcrumb -->
      <nav class="breadcrumb" id="breadcrumb">
        <a href="index.html">Home</a>
        <span>›</span>
        <a href="index.html#categories">Collections</a>
        <span>›</span>
        <span id="bc-category">—</span>
      </nav>
      <h1 class="cat-hero-title" id="cat-hero-title">Collection</h1>
      <p class="cat-hero-desc"  id="cat-hero-desc"></p>
    </div>
  </section>

  <!-- PRODUCTS SECTION -->
  <section class="section products-section">
    <div class="container">
      <!-- Filter / sort bar -->
      <div class="products-bar">
        <p class="products-count" id="products-count"></p>
        <div class="sort-group">
          <label for="sort-select">Sort by</label>
          <select id="sort-select" onchange="sortProducts(this.value)">
            <option value="default">Featured</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
          </select>
        </div>
      </div>

      <!-- Product grid -->
      <div class="products-grid" id="products-grid"></div>

      <!-- Back link -->
      <div class="back-wrap">
        <a href="index.html#categories" class="btn btn-ghost-dark">← Back to All Collections</a>
      </div>
    </div>
  </section>

  <!-- OTHER CATEGORIES -->
  <section class="section other-cats">
    <div class="container">
      <div class="section-header">
        <p class="section-tag">Explore More</p>
        <h2 class="section-title">Other Collections</h2>
      </div>
      <div class="other-cats-grid" id="other-cats-grid"></div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-brand">
          <a href="index.html" class="logo">StoneLight</a>
          <p id="footer-desc"></p>
        </div>
        <div class="footer-col">
          <strong>Quick Links</strong>
          <div id="footer-quick"></div>
        </div>
        <div class="footer-col">
          <strong>Categories</strong>
          <div id="footer-cat"></div>
        </div>
        <div class="footer-col">
          <strong>Support</strong>
          <div id="footer-support"></div>
        </div>
      </div>
      <div class="footer-bottom">
        <p>© <span id="footer-year"></span> <span id="footer-brand-name"></span>. All rights reserved.</p>
        <div class="footer-legal">
          <a href="#">Privacy Policy</a>
          <a href="#">Terms of Service</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/content.js"></script>
  <script src="js/category.js"></script>
</body>
</html>
